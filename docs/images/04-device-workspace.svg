<text x="1233.0" y="178" font-size="14" fill="#8a929e" font-weight="400" text-anchor="middle">Connect scanner</text>
<rect x="1080" y="201" width="306" height="31" rx="6" fill="#eaedf1" stroke="#d5dae1" stroke-width="1"/>
<text x="1233.0" y="222" font-size="14" fill="#8a929e" font-weight="400" text-anchor="middle">Prepare printing…</text>
