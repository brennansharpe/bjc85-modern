<text x="1233.0" y="266" font-size="14" fill="#8a929e" font-weight="400" text-anchor="middle">Open Image Capture</text>
<text x="1080" y="307" font-size="13" fill="#626975" font-weight="400" text-anchor="start">Scanner readiness is detected by native</text>
<text x="1080" y="326" font-size="13" fill="#626975" font-weight="400" text-anchor="start">status replies. A BC-11e print cartridge</text>
<text x="1080" y="345" font-size="13" fill="#626975" font-weight="400" text-anchor="start">is operator-confirmed; no automatic</text>
<text x="1080" y="364" font-size="13" fill="#626975" font-weight="400" text-anchor="start">cartridge or ink-level detection is</text>
<text x="1080" y="383" font-size="13" fill="#626975" font-weight="400" text-anchor="start">claimed.</text>
<rect x="1080" y="425" width="306" height="31" rx="6" fill="#eaedf1" stroke="#d5dae1" stroke-width="1"/>
<text x="1233.0" y="446" font-size="14" fill="#8a929e" font-weight="400" text-anchor="middle">Import white reference…</text>
<rect x="1080" y="469" width="306" height="31" rx="6" fill="#ffffff" stroke="#bdc5cf" stroke-width="1"/>
<text x="1233.0" y="490" font-size="14" fill="#242832" font-weight="400" text-anchor="middle">Calibration guidance…</text>
<rect x="1080" y="513" width="306" height="31" rx="6" fill="#ffffff" stroke="#bdc5cf" stroke-width="1"/>
<text x="1233.0" y="534" font-size="14" fill="#242832" font-weight="400" text-anchor="middle">Show private files</text>
<path d="M1080 572H1386" fill="none" stroke="#d5dae1" stroke-width="1"/>
<text x="1080" y="606" font-size="19" fill="#242832" font-weight="600" text-anchor="start">Recovery &amp; maintenance</text>
<text x="1080" y="638" font-size="13" fill="#626975" font-weight="400" text-anchor="start">If recovery is required, preserve the</text>
<text x="1080" y="657" font-size="13" fill="#626975" font-weight="400" text-anchor="start">capture and inspect the printer before any</text>
<text x="1080" y="676" font-size="13" fill="#626975" font-weight="400" text-anchor="start">further physical work. Restarting never</text>
<text x="1080" y="695" font-size="13" fill="#626975" font-weight="400" text-anchor="start">clears a recovery marker.</text>
<rect x="1080" y="750" width="306" height="31" rx="6" fill="#eaedf1" stroke="#d5dae1" stroke-width="1"/>
<text x="1233.0" y="771" font-size="14" fill="#8a929e" font-weight="400" text-anchor="middle">Recheck device availability</text>
<text x="1080" y="815" font-size="13" fill="#626975" font-weight="400" text-anchor="start">Cleaning, deep cleaning, alignment and ink</text>
<text x="1080" y="834" font-size="13" fill="#626975" font-weight="400" text-anchor="start">levels are unavailable until verified. The</text>
<text x="1080" y="853" font-size="13" fill="#626975" font-weight="400" text-anchor="start">historical black-ink delivery fault is</text>
<text x="1080" y="872" font-size="13" fill="#626975" font-weight="400" text-anchor="start">separate from driver outcomes.</text>
<text x="1080" y="932" font-size="13" fill="#626975" font-weight="400" text-anchor="start">Independent BJC-85 / IS-12 utility. No</text>
<text x="1080" y="951" font-size="13" fill="#626975" font-weight="400" text-anchor="start">Canon endorsement, executables, or artwork.</text>
<text x="29" y="1050" font-size="14" fill="#242832" font-weight="600" text-anchor="start">04 / Device workspace</text>
<text x="1411" y="1050" font-size="13" fill="#626975" font-weight="400" text-anchor="end">Illustrative UI mockup · Synthetic content · 14 Sep 2026</text>
