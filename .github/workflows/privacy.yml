name: Source privacy regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic privacy regressions
        run: python3 tests/repository_privacy_test.py
      - name: Generic tree and reachable-history checks
        # No owner's private-value configuration is available on CI.
        run: python3 scripts/check-repository-privacy.py --history
      - name: Verify and run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version
          "$tool_dir/gitleaks" git --log-opts=--all --redact=100 --no-banner --no-color --ignore-gitleaks-allow --timeout 120 .
          "$tool_dir/gitleaks" dir --redact=100 --no-banner --no-color --ignore-gitleaks-allow --max-archive-depth 2 --max-decode-depth 3 --timeout 120 .
